<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; frame-src 'self' https://pixelroot-9da60.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com wss://*.googleapis.com https://apis.google.com https://pixelroot-9da60.firebaseapp.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="assets/js/frame-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2b5c">
<title>Create Account | PixelRoot</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/signup.css">
<script src="elements.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="brandpane">
    <a href="index.html" class="logo">Pixel<span>Root</span></a>
    <div class="bp-body">
      <div class="eyebrow">Get started</div>
      <h2>Your design team, on demand.</h2>
      <p>Create your free account and start submitting briefs in minutes.</p>
    </div>
  </aside>

  <main class="formpane">
    <div class="box">
      <a href="index.html" class="back">← Back to home</a>
      <div class="card">
        <span class="lbl">Get started</span>
        <h1>Create your account</h1>
        <p class="sub">Pick a package and sign up to start submitting design briefs.</p>
        <form id="f" novalidate>
          <div class="f" style="margin-bottom:6px"><label>Choose your package</label></div>
          <div class="plans" id="plans">
            <label class="plan"><input type="radio" name="plan" value="starter" checked><span class="pc"><b>Starter</b><span class="pr">$29<small>/mo</small></span><span class="pp">8 posts</span></span></label>
            <label class="plan"><input type="radio" name="plan" value="growth"><span class="pop">POPULAR</span><span class="pc"><b>Growth</b><span class="pr">$59<small>/mo</small></span><span class="pp">20 posts</span></span></label>
            <label class="plan"><input type="radio" name="plan" value="pro"><span class="pc"><b>Pro</b><span class="pr">$99<small>/mo</small></span><span class="pp">40 posts</span></span></label>
          </div>
          <div class="f"><label for="name">Full name</label><input id="name" required autocomplete="name" placeholder="Jane Doe"></div>
          <div class="f"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@company.com"></div>
          <div class="fr">
            <div class="f"><label for="pw">Password</label><input id="pw" type="password" minlength="8" required autocomplete="new-password" placeholder="Min. 8 characters"></div>
            <div class="f"><label for="pw2">Confirm password</label><input id="pw2" type="password" required autocomplete="new-password" placeholder="Repeat password"></div>
          </div>
          <button class="btn btn-main" id="go" type="submit">Create account</button>
        </form>
        <div class="or">or</div>
        <button type="button" class="btn btn-ghost" id="gBtn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Continue with Google</button>
        <p class="sw">Already have an account? <a href="signin.html">Sign in</a></p>
      </div>
    </div>
  </main>
</div>



<script type="module" src="assets/js/signup.js"></script>
</body>
</html>
