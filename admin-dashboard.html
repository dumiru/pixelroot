<!DOCTYPE html>
<html lang="en" class="gate">
<head>
<style>html.gate body{display:none!important}</style>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; frame-src 'self' https://pixelroot-9da60.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com wss://*.googleapis.com https://apis.google.com https://pixelroot-9da60.firebaseapp.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="assets/js/frame-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f8fd">
<title>Agency Admin | PixelRoot</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-dashboard.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Admin navigation">
    <a class="brand" href="index.html" aria-label="PixelRoot Admin home">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-name">PixelRoot<small>ADMIN</small></span>
    </a>
    <div class="side-caption">AGENCY WORKSPACE</div>
    <nav id="nav" aria-label="Admin sections"></nav>
    <button class="side-create" id="quickClient" type="button"><span aria-hidden="true">+</span> Add a client</button>
    <button class="me" id="meBtn" type="button" aria-label="Sign out">
      <span class="av" id="meAv" aria-hidden="true">A</span>
      <span class="me-copy"><b id="meName">Admin</b><small>Administrator</small></span>
      <svg class="me-exit" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
    </button>
  </aside>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main class="main">
    <header class="top">
      <button class="ib menu" id="menuBtn" type="button" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="top-context">
        <span>PIXELROOT <i>/</i> ADMIN</span>
        <strong id="topTitle">Overview</strong>
      </div>
      <label class="search-box">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="gsearch" type="search" placeholder="Search records..." aria-label="Search records in this section">
        <kbd>/</kbd>
      </label>
      <button class="ib" id="bellBtn" type="button" aria-label="View notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10 21h4"/></svg>
        <i id="bellDot" hidden></i>
      </button>
    </header>
    <section id="view" aria-label="Admin workspace" tabindex="-1"></section>
  </main>
</div>

<div class="mbg" id="modal" role="presentation">
  <section class="modal" id="modalBox" role="dialog" aria-modal="true" aria-label="Record details"></section>
</div>

<script type="module" src="assets/js/admin-dashboard.js"></script>
</body>
</html>
